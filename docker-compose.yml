version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: agrimarket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       agrimarket
      POSTGRES_USER:     agrimarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrimarket_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Run migrations automatically on first start
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrimarket -d agrimarket"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: agrimarket_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-agrimarket_dev} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-agrimarket_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgAdmin (local dev only — comment out if not needed) ────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agrimarket_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    admin@agrimarket.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools   # Only starts with: docker compose --profile tools up

volumes:
  postgres_data:
  redis_data:
